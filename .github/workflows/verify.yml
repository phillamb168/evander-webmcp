name: Verify preview

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring
          coverage: none
          tools: composer:v2
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Validate Composer metadata
        run: composer validate --working-dir=integrations/drupal --no-check-publish
      - name: Verify tests and distribution contents
        run: npm run verify
      - name: Check PHP syntax
        run: git ls-files -z '*.php' '*.module' | xargs -0 -n 1 php -l
      - name: Build examples
        run: npm run build
      - name: Chrome integration regressions
        run: npm run test:chrome
      - name: Upload preview package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evander-webmcp-0.1.0-alpha.2
          path: |
            dist/evander_webmcp-0.1.0-alpha.2.tar.gz
            dist/evander-browser-0.1.0-alpha.2.tar.gz
            dist/npm/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
